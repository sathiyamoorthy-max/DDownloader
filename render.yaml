services:
  - type: web
    name: ddownloader-telegram-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_API_ID
        sync: false

      - key: TELEGRAM_API_HASH
        sync: false

      - key: ALLOWED_USER_IDS
        sync: false

      - key: MAX_UPLOAD_MB
        value: "100"

      - key: MAX_VIDEO_HEIGHT
        value: "1080"

      - key: MAX_CONCURRENT_DOWNLOADS
        value: "1"

      - key: RATE_LIMIT_SECONDS
        value: "5"

      - key: LOG_LEVEL
        value: "INFO"

      - key: AUTH_DOMAINS
        sync: false

      - key: AUTH_COOKIE
        sync: false

      - key: AUTHORIZATION_HEADER
        sync: false

      - key: AUTH_REFERER
        sync: false
