name: College DRM Lab Tests

on:
  push:
    paths:
      - "college_drm_lab/**"
      - ".github/workflows/college-drm-lab.yml"
  pull_request:
    paths:
      - "college_drm_lab/**"
      - ".github/workflows/college-drm-lab.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: college_drm_lab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: college_drm_lab/requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
