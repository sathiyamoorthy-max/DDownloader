services:
  lab-server:
    build: .
    command: python lab_server.py
    environment:
      PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"

  telegram-bot:
    build: .
    command: python telegram_bot.py
    env_file:
      - .env
    environment:
      LAB_BASE_URL: http://lab-server:5000
      LAB_USER: student
    depends_on:
      - lab-server
